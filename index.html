<!DOCTYPE html>
<html>
<head>
    <title>Welcome to TheCAT's Treasure</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body>
    <h1>Welcome to TheCat's WebPage</h1>
    <div class="main">
        <h2 style="text-align: center; font-size: 22px; font-style: italic;">My Games</h2>
        <hr>
        <p style="font-size: 18px;">Try some of the Games below!</p>
        <div class="games">
            <button class="games-button" id="wor-zle">
                <span class="button-text">Wor-zle</span>
                <div class="tooltip-wrapper">
                    <div class="tooltip-text">A clone of Wordle with multi-letter word support.</div>
                </div>
            </button>
            <p style="font-size: 14px;">Simple Web Browser Game.</p>
        </div>
        <div class="games">
            <button class="games-button" id="rollaball">
                <span class="button-text">Roll-A-Ball</span>
                <div class="tooltip-wrapper">
                    <div class="tooltip-text">A simple 3D ball rolling game with collectable items.</div>
                </div>
            </button>
            <p style="font-size: 14px;">Simple 3D Downloadable Game.</p>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
